name: Release Package

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Verify and Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package token
        shell: bash
        run: |
          test -n "$PACKAGES_USER" || { echo "Missing HAUNTEDMC_PACKAGES_USERNAME" >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" || { echo "Missing HAUNTEDMC_PACKAGES_TOKEN (read/write packages required)" >&2; exit 1; }
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: PACKAGES_USER
          server-password: PACKAGES_TOKEN
      - name: Validate release version
        id: release-version
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          PROJECT_VERSION="$(./mvnw -q -ntp -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PROJECT_VERSION" = "$TAG_VERSION" || { echo "Tag $GITHUB_REF_NAME != Maven $PROJECT_VERSION" >&2; exit 1; }
          echo "value=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify architecture boundaries
        run: bash scripts/verify-architecture.sh
      - name: Verify exact release reactor
        run: ./mvnw -U -B -ntp -Prelease install
      - name: Verify external BOM consumer
        run: bash scripts/verify-bom-consumer.sh
      - name: Publish exact release reactor
        run: ./mvnw -B -ntp -DdeployAtEnd=true -Drevision="${{ steps.release-version.outputs.value }}" -Prelease deploy
