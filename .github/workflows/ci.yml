name: CI Tests and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Tests, architecture and consumer contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Validate package token
        shell: bash
        run: |
          test -n "$PACKAGES_USER" || { echo "Missing HAUNTEDMC_PACKAGES_USERNAME" >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" || { echo "Missing HAUNTEDMC_PACKAGES_TOKEN" >&2; exit 1; }
      - name: Verify architecture boundaries
        run: bash scripts/verify-architecture.sh
      - name: Verify release bump helper
        run: ./update_version.sh --dry-run major
      - name: Verify release-profile reactor
        run: mvn -U -B -ntp -Prelease install
      - name: Verify external BOM consumer
        run: bash scripts/verify-bom-consumer.sh
