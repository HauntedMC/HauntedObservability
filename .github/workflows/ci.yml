name: CI Tests and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Tests, architecture and consumer contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned release CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install HauntedMC/gh-haunted-release --pin ed440a0a2d5ab23af30c36bb22132f8ffa0ea33f
      - name: Verify dependency version ownership
        run: python3 scripts/verify-version-ownership.py

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Validate package token
        shell: bash
        run: |
          test -n "$PACKAGES_USER" || { echo "Missing HAUNTEDMC_PACKAGES_USERNAME" >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" || { echo "Missing HAUNTEDMC_PACKAGES_TOKEN" >&2; exit 1; }
      - name: Verify architecture boundaries
        run: bash scripts/verify-architecture.sh
      - name: Verify release bump helper
        run: ./tools/release/update-version --dry-run major
      - name: Verify release-profile reactor
        run: ./mvnw -U -B -ntp -Prelease install
      - name: Verify external BOM consumer
        run: bash scripts/verify-bom-consumer.sh
