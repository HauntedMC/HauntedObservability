name: CI Tests and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Tests, architecture and consumer contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned release CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install HauntedMC/gh-haunted-release --pin de43c102d81797001eef36fe45725744fdd22031
      - name: Verify dependency version ownership
        run: python3 scripts/verify-version-ownership.py

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Validate package token
        shell: bash
        run: |
          test -n "$PACKAGES_USER" || { echo "Missing HAUNTEDMC_PACKAGES_USERNAME" >&2; exit 1; }
          test -n "$PACKAGES_TOKEN" || { echo "Missing HAUNTEDMC_PACKAGES_TOKEN" >&2; exit 1; }
      - name: Verify architecture boundaries
        run: bash scripts/verify-architecture.sh
      - name: Verify release bump helper
        run: ./tools/release/update-version --dry-run major
      - name: Verify release-profile reactor
        run: ./mvnw -U -B -ntp -Prelease install
      - name: Verify external BOM consumer
        run: bash scripts/verify-bom-consumer.sh

  maven-policy:
    name: Shared Maven policy
    uses: HauntedMC/HauntedPlatform/.github/workflows/maven-ci.yml@10dfbacc8515208bf3b0ee236a8c7688fda49c9e # release hardening
    with:
      maven-command: ./mvnw -U -B -ntp validate
    secrets:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN || github.token }}

  shellcheck:
    name: ShellCheck and release-bump smoke test
    runs-on: ubuntu-24.04
    env:
      PACKAGES_USER: ${{ secrets.HAUNTEDMC_PACKAGES_USERNAME || github.actor }}
      PACKAGES_TOKEN: ${{ secrets.HAUNTEDMC_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned release CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install HauntedMC/gh-haunted-release --pin de43c102d81797001eef36fe45725744fdd22031
      - shell: bash
        run: |
          mapfile -d '' scripts < <(git ls-files -z '*.sh')
          if (( ${#scripts[@]} > 0 )); then shellcheck tools/release/update-version tools/release/prepare-version.sh "${scripts[@]}"; fi
      - run: ./tools/release/update-version --dry-run major

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [test, maven-policy, shellcheck]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CHECK_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every validation job
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = {name: job['result'] for name, job in json.loads(os.environ['CHECK_RESULTS']).items()}
          failed = {name: result for name, result in results.items() if result != 'success'}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          PYTHON
