name: Sync canonical public project files

on:
  push:
    branches:
      - observability-1.0.0

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: observability-1.0.0
          fetch-depth: 0
          persist-credentials: true
      - name: Copy canonical HauntedMC public project files
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/HauntedMC/DataRegistry/v1.15.0"
          curl -fsSL "$base/LICENSE" -o LICENSE
          curl -fsSL "$base/mvnw" -o mvnw
          curl -fsSL "$base/mvnw.cmd" -o mvnw.cmd
          mkdir -p .mvn/wrapper
          curl -fsSL "$base/.mvn/wrapper/maven-wrapper.properties" -o .mvn/wrapper/maven-wrapper.properties
          chmod +x mvnw
          git diff --check
          if git diff --quiet -- LICENSE mvnw mvnw.cmd .mvn/wrapper/maven-wrapper.properties; then
            echo "Canonical project files already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE mvnw mvnw.cmd .mvn/wrapper/maven-wrapper.properties
          git commit -m "Sync canonical public project files"
          git push origin HEAD:observability-1.0.0
